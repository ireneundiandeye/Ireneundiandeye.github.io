  location: "Leipzig, Germany"
  bio: "Data analyst and economist with a strong foundation in data science, policy analysis, and business operations. Currently pursuing an MSc in Economics at Martin-Luther-Universität Halle-Wittenberg and working as a Student Assistant at IAMO, Leipzig, where I analyse multi-country rural well-being data across transition economies in Albania, Kosovo, Moldova, and Romania, curate datasets for publication, and support the organisation of workshops and conferences for the RuWell project. With prior experience at Vanir Capital LLC and Swappie, and proficiency in Python, R, SQL, Tableau, and SAP Analytics Cloud, I turn data into actionable insights across both research and industry settings."
