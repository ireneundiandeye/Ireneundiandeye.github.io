# Navigation pages
nav_pages:
  - title: Home
    url: /
  - title: Projects
    url: /projects/
  - title: Publications
    url: /publications/
  - title: News
    url: /news/
  - title: CV
    url: /cv/
  - title: Contact
    url: /contact/

# Jekyll settings
markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /publications/:name/
  news:
    output: true
    permalink: /news/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: news
    values:
      layout: news-post
  - scope:
      path: "_pages"
    values:
      layout: page

exclude:
  - Gemfile.lock
  - node_modules
  - README.md
